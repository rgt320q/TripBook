<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixel Art Beach Traveler -->
  <!-- Background -->
  <rect width="64" height="64" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="52" cy="12" r="8" fill="#FFD700"/>
  <rect x="48" y="2" width="8" height="4" fill="#FFD700"/>
  <rect x="58" y="8" width="4" height="8" fill="#FFD700"/>
  
  <!-- Head -->
  <rect x="20" y="14" width="24" height="18" fill="#FDBCB4"/>
  
  <!-- Sunhat -->
  <rect x="12" y="10" width="40" height="4" fill="#F0E68C"/>
  <rect x="18" y="6" width="28" height="8" fill="#F0E68C"/>
  
  <!-- Sunglasses -->
  <rect x="24" y="20" width="6" height="4" fill="#000"/>
  <rect x="34" y="20" width="6" height="4" fill="#000"/>
  <rect x="30" y="22" width="4" height="2" fill="#000"/>
  
  <!-- Mouth -->
  <rect x="28" y="26" width="8" height="2" fill="#8B0000"/>
  
  <!-- Body -->
  <rect x="16" y="32" width="32" height="18" fill="#FF69B4"/>
  
  <!-- Beach bag -->
  <rect x="48" y="36" width="12" height="10" fill="#FF1493"/>
  <rect x="50" y="34" width="8" height="4" fill="#8B008B"/>
  
  <!-- Arms -->
  <rect x="8" y="36" width="8" height="14" fill="#FDBCB4"/>
  <rect x="48" y="36" width="8" height="14" fill="#FDBCB4"/>
  
  <!-- Legs -->
  <rect x="20" y="50" width="8" height="14" fill="#FDBCB4"/>
  <rect x="36" y="50" width="8" height="14" fill="#FDBCB4"/>
  
  <!-- Flip-flops -->
  <rect x="18" y="60" width="12" height="4" fill="#FF4500"/>
  <rect x="34" y="60" width="12" height="4" fill="#FF4500"/>
  
  <!-- Beach ball -->
  <circle cx="12" cy="46" r="6" fill="#FF0000"/>
  <path d="M 6 46 Q 12 40 18 46" fill="#FFF"/>
  <path d="M 6 46 Q 12 52 18 46" fill="#0000FF"/>
</svg>