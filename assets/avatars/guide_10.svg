<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixel Art Adventure Guide -->
  <!-- Background -->
  <rect width="64" height="64" fill="#87CEEB"/>
  
  <!-- Forest trees -->
  <rect x="4" y="35" width="8" height="29" fill="#8B4513"/>
  <circle cx="8" cy="32" r="8" fill="#228B22"/>
  <rect x="52" y="40" width="6" height="24" fill="#8B4513"/>
  <circle cx="55" cy="37" r="7" fill="#32CD32"/>
  
  <!-- Head -->
  <rect x="20" y="10" width="24" height="20" fill="#FDBCB4"/>
  
  <!-- Ranger hat -->
  <rect x="16" y="6" width="32" height="8" fill="#8B4513"/>
  <rect x="18" y="2" width="28" height="4" fill="#8B4513"/>
  <rect x="30" y="2" width="4" height="2" fill="#228B22"/>
  
  <!-- Eyes -->
  <rect x="24" y="16" width="4" height="4" fill="#000"/>
  <rect x="36" y="16" width="4" height="4" fill="#000"/>
  
  <!-- Beard -->
  <rect x="24" y="24" width="16" height="8" fill="#8B4513"/>
  
  <!-- Body -->
  <rect x="16" y="30" width="32" height="20" fill="#228B22"/>
  
  <!-- Ranger badge -->
  <rect x="20" y="34" width="8" height="6" fill="#FFD700"/>
  <rect x="22" y="36" width="4" height="2" fill="#8B0000"/>
  
  <!-- Binoculars -->
  <rect x="32" y="32" width="12" height="6" fill="#000"/>
  <circle cx="36" cy="35" r="2" fill="#000080"/>
  <circle cx="40" cy="35" r="2" fill="#000080"/>
  
  <!-- Arms -->
  <rect x="8" y="34" width="8" height="16" fill="#FDBCB4"/>
  <rect x="48" y="34" width="8" height="16" fill="#FDBCB4"/>
  
  <!-- Whistle -->
  <rect x="6" y="32" width="4" height="2" fill="#C0C0C0"/>
  
  <!-- Legs -->
  <rect x="20" y="50" width="8" height="14" fill="#8B4513"/>
  <rect x="36" y="50" width="8" height="14" fill="#8B4513"/>
  
  <!-- Hiking boots -->
  <rect x="18" y="60" width="12" height="4" fill="#000"/>
  <rect x="34" y="60" width="12" height="4" fill="#000"/>
  
  <!-- Wildlife (bird) -->
  <rect x="46" y="18" width="6" height="4" fill="#8B0000"/>
  <rect x="48" y="16" width="2" height="2" fill="#8B0000"/>
  <rect x="50" y="20" width="4" height="2" fill="#000"/>
