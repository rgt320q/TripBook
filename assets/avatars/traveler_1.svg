<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixel Art Traveler with Backpack -->
  <!-- Background -->
  <rect width="64" height="64" fill="#87CEEB"/>
  
  <!-- Head -->
  <rect x="20" y="12" width="24" height="20" fill="#FDBCB4"/>
  
  <!-- Hair -->
  <rect x="16" y="8" width="32" height="8" fill="#8B4513"/>
  <rect x="16" y="12" width="4" height="8" fill="#8B4513"/>
  <rect x="44" y="12" width="4" height="8" fill="#8B4513"/>
  
  <!-- Eyes -->
  <rect x="24" y="18" width="4" height="4" fill="#000"/>
  <rect x="36" y="18" width="4" height="4" fill="#000"/>
  
  <!-- Nose -->
  <rect x="30" y="22" width="4" height="2" fill="#F4A460"/>
  
  <!-- Mouth -->
  <rect x="28" y="26" width="8" height="2" fill="#8B0000"/>
  
  <!-- Body -->
  <rect x="16" y="32" width="32" height="20" fill="#4169E1"/>
  
  <!-- Backpack -->
  <rect x="44" y="28" width="12" height="16" fill="#228B22"/>
  <rect x="46" y="30" width="8" height="4" fill="#006400"/>
  
  <!-- Arms -->
  <rect x="8" y="36" width="8" height="16" fill="#FDBCB4"/>
  <rect x="48" y="36" width="8" height="16" fill="#FDBCB4"/>
  
  <!-- Legs -->
  <rect x="20" y="52" width="8" height="12" fill="#8B4513"/>
  <rect x="36" y="52" width="8" height="12" fill="#8B4513"/>
  
  <!-- Feet -->
  <rect x="18" y="60" width="12" height="4" fill="#000"/>
  <rect x="34" y="60" width="12" height="4" fill="#000"/>
  
  <!-- Map in hand -->
  <rect x="4" y="32" width="8" height="6" fill="#FFF"/>
  <rect x="5" y="33" width="6" height="4" fill="#90EE90"/>
</svg>