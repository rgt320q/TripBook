<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixel Art Mountain Hiker -->
  <!-- Background -->
  <rect width="64" height="64" fill="#87CEEB"/>
  
  <!-- Mountains -->
  <polygon points="0,50 20,30 40,45 64,25 64,64 0,64" fill="#8B7D6B"/>
  
  <!-- Head -->
  <rect x="22" y="14" width="20" height="18" fill="#FDBCB4"/>
  
  <!-- Hat -->
  <rect x="18" y="10" width="28" height="8" fill="#8B0000"/>
  <rect x="20" y="6" width="24" height="4" fill="#8B0000"/>
  
  <!-- Eyes -->
  <rect x="26" y="20" width="3" height="3" fill="#000"/>
  <rect x="35" y="20" width="3" height="3" fill="#000"/>
  
  <!-- Mouth -->
  <rect x="30" y="26" width="4" height="2" fill="#8B0000"/>
  
  <!-- Body -->
  <rect x="18" y="32" width="28" height="18" fill="#228B22"/>
  
  <!-- Hiking stick -->
  <rect x="50" y="20" width="2" height="30" fill="#8B4513"/>
  <rect x="48" y="18" width="6" height="4" fill="#8B4513"/>
  
  <!-- Arms -->
  <rect x="10" y="38" width="8" height="12" fill="#FDBCB4"/>
  <rect x="46" y="38" width="8" height="12" fill="#FDBCB4"/>
  
  <!-- Legs -->
  <rect x="22" y="50" width="7" height="10" fill="#000080"/>
  <rect x="35" y="50" width="7" height="10" fill="#000080"/>
  
  <!-- Hiking boots -->
  <rect x="20" y="58" width="11" height="6" fill="#8B4513"/>
  <rect x="33" y="58" width="11" height="6" fill="#8B4513"/>
</svg>