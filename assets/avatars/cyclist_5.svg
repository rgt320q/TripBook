<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixel Art Cyclist -->
  <!-- Background -->
  <rect width="64" height="64" fill="#87CEEB"/>
  
  <!-- Head -->
  <rect x="22" y="8" width="20" height="18" fill="#FDBCB4"/>
  
  <!-- Helmet -->
  <rect x="18" y="4" width="28" height="8" fill="#FF4500"/>
  <rect x="20" y="2" width="24" height="2" fill="#FF4500"/>
  
  <!-- Eyes -->
  <rect x="26" y="14" width="3" height="3" fill="#000"/>
  <rect x="35" y="14" width="3" height="3" fill="#000"/>
  
  <!-- Mouth -->
  <rect x="30" y="20" width="4" height="2" fill="#8B0000"/>
  
  <!-- Body -->
  <rect x="18" y="26" width="28" height="16" fill="#32CD32"/>
  
  <!-- Arms -->
  <rect x="10" y="30" width="8" height="12" fill="#FDBCB4"/>
  <rect x="46" y="30" width="8" height="12" fill="#FDBCB4"/>
  
  <!-- Bicycle handlebars -->
  <rect x="6" y="28" width="12" height="4" fill="#000"/>
  <rect x="46" y="28" width="12" height="4" fill="#000"/>
  
  <!-- Legs -->
  <rect x="22" y="42" width="7" height="14" fill="#000080"/>
  <rect x="35" y="42" width="7" height="14" fill="#000080"/>
  
  <!-- Bicycle wheels -->
  <circle cx="16" cy="52" r="8" fill="#000" stroke="#696969" stroke-width="2"/>
  <circle cx="48" cy="52" r="8" fill="#000" stroke="#696969" stroke-width="2"/>
  
  <!-- Bicycle frame -->
  <rect x="16" y="50" width="32" height="4" fill="#FF0000"/>
  <rect x="30" y="42" width="4" height="14" fill="#FF0000"/>
  
  <!-- Shoes -->
  <rect x="20" y="54" width="8" height="4" fill="#000"/>
  <rect x="36" y="54" width="8" height="4" fill="#000"/>
</svg>