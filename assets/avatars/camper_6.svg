<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixel Art Camper -->
  <!-- Background -->
  <rect width="64" height="64" fill="#4B0082"/>
  
  <!-- Stars -->
  <rect x="8" y="8" width="2" height="2" fill="#FFF"/>
  <rect x="20" y="4" width="2" height="2" fill="#FFF"/>
  <rect x="44" y="6" width="2" height="2" fill="#FFF"/>
  <rect x="54" y="12" width="2" height="2" fill="#FFF"/>
  
  <!-- Campfire -->
  <rect x="6" y="50" width="12" height="8" fill="#8B4513"/>
  <rect x="8" y="44" width="8" height="6" fill="#FF4500"/>
  <rect x="10" y="40" width="4" height="4" fill="#FFD700"/>
  
  <!-- Head -->
  <rect x="28" y="20" width="20" height="16" fill="#FDBCB4"/>
  
  <!-- Beanie -->
  <rect x="26" y="16" width="24" height="8" fill="#800080"/>
  <rect x="28" y="12" width="20" height="4" fill="#800080"/>
  
  <!-- Eyes -->
  <rect x="32" y="26" width="3" height="3" fill="#000"/>
  <rect x="41" y="26" width="3" height="3" fill="#000"/>
  
  <!-- Mouth -->
  <rect x="36" y="30" width="4" height="2" fill="#8B0000"/>
  
  <!-- Body -->
  <rect x="24" y="36" width="28" height="18" fill="#228B22"/>
  
  <!-- Sleeping bag -->
  <rect x="20" y="48" width="36" height="12" fill="#DC143C"/>
  <rect x="22" y="50" width="32" height="8" fill="#8B0000"/>
  
  <!-- Arms -->
  <rect x="16" y="40" width="8" height="12" fill="#FDBCB4"/>
  <rect x="52" y="40" width="8" height="12" fill="#FDBCB4"/>
  
  <!-- Tent -->
  <polygon points="46,20 58,20 52,10" fill="#FF6347"/>
  <rect x="50" y="18" width="4" height="8" fill="#8B4513"/>
</svg>