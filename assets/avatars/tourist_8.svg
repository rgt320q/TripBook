<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixel Art City Tourist -->
  <!-- Background -->
  <rect width="64" height="64" fill="#87CEEB"/>
  
  <!-- City buildings -->
  <rect x="2" y="40" width="12" height="24" fill="#696969"/>
  <rect x="14" y="30" width="8" height="34" fill="#778899"/>
  <rect x="50" y="35" width="10" height="29" fill="#708090"/>
  
  <!-- Building windows -->
  <rect x="4" y="42" width="2" height="2" fill="#FFD700"/>
  <rect x="8" y="42" width="2" height="2" fill="#FFD700"/>
  <rect x="16" y="32" width="2" height="2" fill="#FFD700"/>
  <rect x="52" y="38" width="2" height="2" fill="#FFD700"/>
  <rect x="56" y="38" width="2" height="2" fill="#FFD700"/>
  
  <!-- Head -->
  <rect x="24" y="12" width="20" height="18" fill="#FDBCB4"/>
  
  <!-- Hair -->
  <rect x="22" y="8" width="24" height="8" fill="#000"/>
  <rect x="22" y="12" width="2" height="8" fill="#000"/>
  <rect x="44" y="12" width="2" height="8" fill="#000"/>
  
  <!-- Glasses -->
  <rect x="26" y="18" width="6" height="4" fill="#000"/>
  <rect x="36" y="18" width="6" height="4" fill="#000"/>
  <rect x="32" y="20" width="4" height="2" fill="#000"/>
  <rect x="28" y="20" width="2" height="2" fill="#FFF"/>
  <rect x="38" y="20" width="2" height="2" fill="#FFF"/>
  
  <!-- Mouth -->
  <rect x="30" y="26" width="4" height="2" fill="#8B0000"/>
  
  <!-- Body -->
  <rect x="20" y="30" width="28" height="20" fill="#000080"/>
  
  <!-- Tourist map -->
  <rect x="16" y="34" width="8" height="12" fill="#FFF"/>
  <rect x="17" y="35" width="6" height="4" fill="#90EE90"/>
  <rect x="17" y="40" width="3" height="2" fill="#FF0000"/>
  <rect x="21" y="40" width="2" height="2" fill="#0000FF"/>
  
  <!-- Arms -->
  <rect x="12" y="34" width="8" height="14" fill="#FDBCB4"/>
  <rect x="48" y="34" width="8" height="14" fill="#FDBCB4"/>
  
  <!-- Camera -->
  <rect x="48" y="36" width="10" height="6" fill="#000"/>
  <rect x="50" y="38" width="6" height="2" fill="#696969"/>
  
  <!-- Legs -->
  <rect x="24" y="50" width="7" height="14" fill="#8B4513"/>
  <rect x="37" y="50" width="7" height="14" fill="#8B4513"/>
  
  <!-- Shoes -->
  <rect x="22" y="60" width="11" height="4" fill="#000"/>
  <rect x="35" y="60" width="11" height="4" fill="#000"/>
