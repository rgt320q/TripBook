<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Pixel Art Explorer with Compass -->
  <!-- Background -->
  <rect width="64" height="64" fill="#87CEEB"/>
  
  <!-- Head -->
  <rect x="20" y="12" width="24" height="18" fill="#FDBCB4"/>
  
  <!-- Explorer hat -->
  <rect x="16" y="8" width="32" height="8" fill="#8B4513"/>
  <rect x="18" y="4" width="28" height="4" fill="#8B4513"/>
  <rect x="14" y="12" width="36" height="2" fill="#8B4513"/>
  
  <!-- Eyes -->
  <rect x="24" y="18" width="4" height="4" fill="#000"/>
  <rect x="36" y="18" width="4" height="4" fill="#000"/>
  
  <!-- Mustache -->
  <rect x="26" y="22" width="12" height="3" fill="#8B4513"/>
  
  <!-- Mouth -->
  <rect x="30" y="26" width="4" height="2" fill="#8B0000"/>
  
  <!-- Body -->
  <rect x="16" y="30" width="32" height="22" fill="#D2691E"/>
  
  <!-- Vest pockets -->
  <rect x="20" y="34" width="6" height="8" fill="#8B4513"/>
  <rect x="38" y="34" width="6" height="8" fill="#8B4513"/>
  
  <!-- Compass -->
  <rect x="26" y="36" width="12" height="12" fill="#DAA520"/>
  <rect x="28" y="38" width="8" height="8" fill="#FFF"/>
  <rect x="30" y="40" width="4" height="4" fill="#FF0000"/>
  
  <!-- Arms -->
  <rect x="8" y="34" width="8" height="16" fill="#FDBCB4"/>
  <rect x="48" y="34" width="8" height="16" fill="#FDBCB4"/>
  
  <!-- Legs -->
  <rect x="20" y="52" width="8" height="12" fill="#8B4513"/>
  <rect x="36" y="52" width="8" height="12" fill="#8B4513"/>
  
  <!-- Boots -->
  <rect x="18" y="60" width="12" height="4" fill="#000"/>
  <rect x="34" y="60" width="12" height="4" fill="#000"/>
</svg>